# Prepares a runner for testing and building Cetli. The repository has to be checked out first.
name: Set up
description: Node.js, the Linux build dependencies, the Rust build cache and the npm packages

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
    - name: Install the Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf xvfb imagemagick
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: src-tauri
    - name: Install the npm packages
      shell: bash
      run: npm ci
